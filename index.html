<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramveer AI Study</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f5ff;
            color: #172554;
            text-align: center;
        }

        header {
            background: #123c91;
            color: white;
            padding: 25px 12px;
        }

        h1 {
            margin: 0 0 8px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 18px;
            margin: 15px auto;
            border-radius: 14px;
            max-width: 420px;
            box-shadow: 0 3px 12px #ccd6e8;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 16px;
        }

        footer {
            padding: 20px;
            color: #52617a;
        }
    </style>
</head>

<body>
    <header>
        <h1>Ramveer AI Study</h1>
        <p>सीखो आसान हिंदी में! 🚀</p>
    </header>

    <main>
        <h2>आपकी पढ़ाई, आपकी सफलता 📚</h2>
        <p>मुफ्त में सीखें और अपना ज्ञान बढ़ाएँ।</p>

        <div class="card">
            <h3>🌿 Botany</h3>
            <p>वनस्पति विज्ञान के आसान नोट्स।</p>
            <button onclick="study('Botany')">पढ़ना शुरू करें</button>
        </div>

        <div class="card">
            <h3>💻 Computer Application</h3>
            <p>कंप्यूटर, Python और Software Engineering।</p>
            <button onclick="study('Computer Application')">सीखना शुरू करें</button>
        </div>

        <div class="card">
            <h3>🤖 AI Study Helper</h3>
            <p>अपना सवाल लिखें और पढ़ाई शुरू करें।</p>
            <input id="question" placeholder="अपना सवाल लिखें" style="padding:10px;max-width:85%;width:260px">
            <br><br>
            <button onclick="askAI()">सवाल पूछें</button>
            <p id="answer"></p>
        </div>
    </main>

    <footer>
        © 2026 Ramveer AI Labs
    </footer>

    <script>
        function study(subject) {
            alert(subject + " के नोट्स जल्द जोड़े जाएँगे!");
        }

        function askAI() {
            const q = document.getElementById("question").value.trim();
            document.getElementById("answer").textContent =
                q ? "आपका सवाल: " + q +
                " — AI उत्तर सुविधा अभी जोड़नी बाकी है।" :
                "कृपया पहले अपना सवाल लिखें।";
        }
    </script>
</body>

</html>
